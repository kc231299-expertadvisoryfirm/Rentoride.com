<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentoRide | Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <main class="auth-page">

    <!-- Vehicle background -->
    <div class="vehicle-bg">
      <div class="overlay"></div>

      <div class="brand">
        <a href="index.html">
          <span class="brand-icon">🏍️</span>
          Rento<span>Ride</span>
        </a>
      </div>

      <div class="hero-copy">
        <p class="eyebrow">RIDE • RENT • REPEAT</p>
        <h1>Your ride.<br><span>Your journey.</span></h1>
        <p>Rent bikes and cars with a simple, secure and premium experience.</p>
      </div>

      <div class="vehicle-label bike-label">🏍️ BIKES</div>
      <div class="vehicle-label car-label">🚗 CARS</div>
    </div>

    <!-- Center authentication card -->
    <section class="auth-card">

      <div class="mobile-brand">
        <a href="index.html">
          🏍️ Rento<span>Ride</span>
        </a>
      </div>

      <div class="auth-heading">
        <h2 id="formTitle">Welcome Back</h2>
        <p id="formSubtitle">Login to continue your RentoRide journey.</p>
      </div>

      <!-- Login / Signup tabs -->
      <div class="auth-tabs">
        <button class="tab active" id="loginTab">Login</button>
        <button class="tab" id="signupTab">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" class="auth-form">

        <label for="loginEmail">Email Address</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="loginPassword">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="show-password" data-target="loginPassword">Show</button>
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>

          <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>

        <button type="submit" class="primary-btn">
          Login <span>→</span>
        </button>

        <div class="divider"><span>OR</span></div>

        <button type="button" class="google-btn" id="googleLogin">
          <span class="google-icon">G</span>
          Continue with Google
        </button>

        <p class="switch-text">
          New to RentoRide?
          <button type="button" id="switchToSignup">Create Account</button>
        </p>

      </form>


      <!-- SIGNUP -->
      <form id="signupForm" class="auth-form hidden">

        <label for="signupName">Full Name</label>
        <input
          type="text"
          id="signupName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <label for="signupPhone">Mobile Number</label>
        <input
          type="tel"
          id="signupPhone"
          placeholder="Enter mobile number"
          autocomplete="tel"
          required
        >

        <label for="signupEmail">Email Address</label>
        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="signupPassword">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          >
          <button type="button" class="show-password" data-target="signupPassword">Show</button>
        </div>

        <label for="signupConfirm">Confirm Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="signupConfirm"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          >
          <button type="button" class="show-password" data-target="signupConfirm">Show</button>
        </div>

        <div class="role-title">I want to</div>

        <div class="role-options">
          <label class="role-card selected">
            <input type="radio" name="role" value="customer" checked>
            <span class="role-icon">🏍️</span>
            <span>
              <strong>Rent a Vehicle</strong>
              <small>Book bikes & cars</small>
            </span>
          </label>

          <label class="role-card">
            <input type="radio" name="role" value="owner">
            <span class="role-icon">🚗</span>
            <span>
              <strong>List My Vehicle</strong>
              <small>Become a vehicle owner</small>
            </span>
          </label>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required>
          <span>I agree to the <a href="#">Terms</a> & <a href="#">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="primary-btn">
          Create Account <span>→</span>
        </button>

        <p class="switch-text">
          Already have an account?
          <button type="button" id="switchToLogin">Login</button>
        </p>

      </form>

      <div id="authMessage" class="auth-message"></div>

    </section>

  </main>

  <script src="js/login.js"></script>
</body>
</html>
